name: Optimize IP Blocklist

on:
  push:
    paths:
      - 'blocklist.txt'
  workflow_dispatch:

jobs:
  aggregate-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Разрешаем токену читать переменные репозитория
      actions: read 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Whitelist Securely
        env:
          # Встроенный токен авторизации
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Скачиваем значение переменной MY_WHITELIST через API и прячем во временный файл.
          # Если переменная не создана, команда не сломает пайплайн (создаст пустой файл).
          gh api /repos/${{ github.repository }}/actions/variables/MY_WHITELIST --jq '.value' > my_whitelist.tmp || touch my_whitelist.tmp

      - name: Run Optimization Script
        run: python optimize.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add blocklist.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-optimize blocklist (dedup, aggregate, whitelist)"
            git push
          else
            echo "No optimization needed."
          fi
